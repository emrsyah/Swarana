name: Build APK

on:
  push:
    branches: [main, feat/new-swarana]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build release APK
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --dart-define=OPENROUTER_API_KEY="$OPENROUTER_API_KEY"
          cp build/app/outputs/flutter-apk/app-release.apk swarana.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest swarana.apk \
            --title "Swarana (latest build)" \
            --notes "Built from ${{ github.ref_name }} @ ${{ github.sha }}. Download swarana.apk and install on Android 9+." \
            --target ${{ github.sha }} \
            --latest
