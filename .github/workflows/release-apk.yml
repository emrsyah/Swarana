name: Build APK

on:
  push:
    branches: [main, feat/new-swarana]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - run: flutter pub get

      # Same signing key every run so new APKs install as updates.
      - name: Restore signing key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > android/app/swarana-study.keystore
          else
            echo "::warning::SIGNING_KEYSTORE_B64 not set; APK is signed with a throwaway debug key"
          fi

      - name: Build release APK
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --dart-define=OPENROUTER_API_KEY="$OPENROUTER_API_KEY"
          cp build/app/outputs/flutter-apk/app-release.apk swarana.apk

      - uses: actions/upload-artifact@v4
        with:
          name: swarana-apk
          path: swarana.apk
          retention-days: 7

      # Manual runs on other branches only build (APK in the run's artifacts).
      - name: Publish to the "latest" release
        if: github.event_name == 'push' || github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest swarana.apk \
            --title "Swarana (latest build)" \
            --notes "Built from ${{ github.ref_name }} @ ${{ github.sha }}. Download swarana.apk and install on Android 9+." \
            --target ${{ github.sha }} \
            --latest
